services:
  postgres:
    image: postgres:16-alpine
    container_name: proofline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proofline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proofline}
      POSTGRES_DB: ${POSTGRES_DB:-proofline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - proofline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proofline} -d ${POSTGRES_DB:-proofline}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proofline_pgdata:
